<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="careGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f766e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="160" height="160" rx="36" fill="#F0FDFA"/>
  <!-- Circular caring hands & heart icon -->
  <g filter="url(#softShadow)" transform="translate(10, 10)">
    <!-- Outer protecting arc -->
    <path d="M 70 20 A 50 50 0 1 1 25 95" fill="none" stroke="url(#careGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="25" cy="95" r="7" fill="#0D9488"/>
    <!-- Heart in center symbolizing family love & care -->
    <path d="M 70 52 C 70 52, 60 40, 48 40 C 37 40, 32 49, 32 58 C 32 75, 55 92, 70 102 C 85 92, 108 75, 108 58 C 108 49, 103 40, 92 40 C 80 40, 70 52, 70 52 Z" fill="url(#heartGrad)"/>
    <!-- Cross/Plus accent for healthcare inside heart -->
    <path d="M 70 58 L 70 78 M 60 68 L 80 68" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
